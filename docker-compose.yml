services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64   # postgis image has no arm64 build; runs under emulation on Apple silicon
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://geo:geo@db:5432/geo?sslmode=disable
      PORT: "8080"
      CORS_ORIGIN: "*"
      RATE_LIMIT_RPS: "50"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
